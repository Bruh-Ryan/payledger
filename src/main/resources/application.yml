spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payledger}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  sql:
    init:
      mode: never
  # Use virtual threads for request processing and asynchronous tasks (Java 21)
  threads:
    virtual:
      enabled: true

server:
  # Railway (and similar PaaS providers) inject a PORT variable;
  # fall back to 8080 for local development.
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 200
      min-spare: 10

# JWT Configuration
app:
  jwt:
    # Base64-encoded secret; must decode to at least 32 bytes (HS256 minimum).
    # Override with the APP_JWT_SECRET environment variable in production.
    secret: '${APP_JWT_SECRET:KmMkiGV/hFd7o7CIN93sHhJExQYo1QSmIM6YVf7a/cB4BNeGgQfUILyEOmj6wodk}'
    expiration: 86400000 # 24 hours in milliseconds
  cors:
    # Comma-separated list of browser origins allowed to call the API.
    # Patterns are supported, e.g. https://*.vercel.app for preview deployments.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging
logging:
  level:
    root: INFO
    com.example.payledger: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
